[project]
name = "redops"
version = "0.1.0"
description = "Self-hosted red team operations dashboard"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "mcp"]

[project.scripts]
redops = "redops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["redops"]

[tool.setuptools.package-data]
redops = ["static/*"]
